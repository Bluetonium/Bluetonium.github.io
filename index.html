<head>
  <title>Bluetonium</title>
  <style>
    #awesomecat {
      display: flex;
      margin: auto;
      width: 500px;
      height: 500px;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      position: absolute;
    }
    #hellyeah {
      top: -400;
      left: 0;
      right: 0;
      bottom: 0;
      position: absolute;
      margin: auto;
      width: 600;
      height: 300;
      text-align: center;
      font-size: 50px;
      font-family: cursive;
    }
  </style>
</head>
<body>
  <h1 id="hellyeah">stuff's comin soon ok</h1>
  <img src="awesomecat.png" id="awesomecat">
  <script>
    var silly = document.getElementById("awesomecat");
    function loop() {
      var randomnessX = Math.floor(Math.random()*10) - 5;
      var randomnessY = Math.floor(Math.random()*10) - 5;
      var randomnessR = Math.floor(Math.random()*10) - 5;
      silly.style.transform = "skew("+randomnessX+"deg,"+randomnessY+"deg) rotate("+randomnessR+"deg)";
                

      setTimeout(loop,10);
    }
    setTimeout(loop,10);
  </script>
</body>
